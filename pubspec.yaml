name: sprout
description: "A creature that needs you to go outside. On-device AI, sunlight sensor, grass detection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  light_sensor: ^3.0.2
  camera: ^0.12.0+2
  image_picker: ^1.2.4
  image: ^4.10.1
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  crypto: ^3.0.6
  flutter_edge_ai: ^2.1.0
  flutter_edge_ai_litertlm: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/quests/
    - assets/testpack/
